services:
  pdf-compiler:
    build: ./services/pdf-compiler
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    pids_limit: 32
    mem_limit: 512m
    cpus: 1.0
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700"]
    networks: [compiler]
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    env_file: .env
    environment: &environment
      DATABASE_URL: postgres://platform:platform@db:5432/platform
      ATTACHMENT_DIR: /data/attachments
    command: ["pnpm", "db:migrate"]
    depends_on:
      db: { condition: service_healthy }
  web:
    build: .
    env_file: .env
    environment:
      <<: *environment
      PORT: 3000
    command: ["pnpm", "--filter", "@platform/web", "start"]
    volumes: ["attachments:/data/attachments"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  worker:
    networks: [default, compiler]
    build: .
    env_file: .env
    environment:
      <<: *environment
      PDF_COMPILER_URL: http://pdf-compiler:8080
    command: ["pnpm", "worker"]
    volumes: ["attachments:/data/attachments"]
    depends_on:
      pdf-compiler: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    command:
      [
        "caddy",
        "reverse-proxy",
        "--from",
        "agent.ofintech.net",
        "--to",
        "web:3000",
      ]
    ports: ["80:80", "443:443"]
    volumes: ["caddy:/data"]
    depends_on: [web]
    restart: unless-stopped
volumes:
  postgres:
  attachments:
  caddy:

networks:
  compiler:
    internal: true
