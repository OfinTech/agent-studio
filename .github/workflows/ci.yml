name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform
        ports: ["5438:5432"]
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SETUP_ADMIN_PASSWORD: ci-synthetic-password-only
      E2E_ADMIN_PASSWORD: ci-synthetic-password-only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:local
      - run: pnpm db:migrate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: docker compose --profile native up --build -d pdf-compiler pdf-local-worker
      - run: pnpm test:pdf
      - run: pnpm test:pdf:isolation
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - run: docker compose -p ui-smoke -f docker-compose.yml -f docker-compose.smoke.yml up --build -d
      - run: pnpm test:smoke
      - if: always()
        run: docker compose -p ui-smoke -f docker-compose.yml -f docker-compose.smoke.yml down
      - uses: actions/upload-artifact@v4
        if: always()
        # Diagnostics must not invalidate successful verification when storage is full.
        continue-on-error: true
        with:
          name: browser-results
          path: test-results/
          retention-days: 7
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      SERVER: ubuntu@84.8.97.88
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 84.8.97.88 >> ~/.ssh/known_hosts
      - run: ssh "$SERVER" "mkdir -p agent-platform-releases/$GITHUB_SHA"
      - run: rsync -az --delete --exclude-from=.dockerignore --exclude=.env ./ "$SERVER:agent-platform-releases/$GITHUB_SHA/"
      - run: ssh "$SERVER" "bash agent-platform-releases/$GITHUB_SHA/scripts/deploy.sh $GITHUB_SHA agent-platform-releases/$GITHUB_SHA"
