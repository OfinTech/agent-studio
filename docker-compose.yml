services:
  pdf-compiler:
    build: ./services/pdf-compiler
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    pids_limit: 32
    mem_limit: 512m
    cpus: 1.0
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700"]
    networks: [compiler]
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  # Docker does not publish ports on internal-only networks. This optional
  # worker-side bridge serves native development without giving the compiler egress.
  pdf-local-worker:
    profiles: [native]
    build: ./services/pdf-compiler
    command: ["python3", "-B", "/opt/local-bridge.py"]
    networks: [default, compiler]
    ports: ["127.0.0.1:8088:8080"]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 64m
    depends_on:
      pdf-compiler: { condition: service_healthy }
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports: ["127.0.0.1:5438:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 3s
      retries: 20
  migrate:
    build: .
    env_file: .env
    environment: &environment
      DATABASE_URL: postgres://platform:platform@db:5432/platform
      ATTACHMENT_DIR: /data/attachments
      MOCK_API_URL: http://mock-api:4010/receipts
    command: ["sh", "-c", "pnpm db:migrate && pnpm db:seed"]
    depends_on:
      db: { condition: service_healthy }
  web:
    build: .
    env_file: .env
    environment:
      <<: *environment
      PORT: 3000
    command: ["pnpm", "--filter", "@platform/web", "start"]
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["attachments:/data/attachments"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  worker:
    networks: [default, compiler]
    build: .
    env_file: .env
    environment:
      <<: *environment
      PDF_COMPILER_URL: http://pdf-compiler:8080
    command: ["pnpm", "worker"]
    volumes: ["attachments:/data/attachments"]
    depends_on:
      pdf-compiler: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      mock-api: { condition: service_started }
  mock-api:
    build: .
    command: ["pnpm", "mock-api"]
    environment:
      MOCK_STATE_DIR: /data/mock
    volumes: ["mock:/data/mock"]
volumes:
  postgres:
  attachments:
  mock:

networks:
  compiler:
    internal: true
